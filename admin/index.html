<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>홍능조경 관리자</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body{
  background:#f5f7f4
}

.admin-wrap{
  width:min(1100px,calc(100% - 28px));
  margin:100px auto 60px
}

.admin-card{
  background:#fff;
  border:1px solid #e1e7e1;
  border-radius:14px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
  margin-bottom:18px
}

.admin-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.admin-head h1{
  margin:0
}

.admin-form{
  display:grid;
  grid-template-columns:1fr 180px 1fr auto;
  gap:10px;
  align-items:end
}

.admin-form label{
  display:grid;
  gap:6px;
  font-size:13px;
  font-weight:800;
  color:#31513d
}

.admin-form input,
.admin-form select{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border:1px solid #d5ddd6;
  border-radius:8px;
  background:#fff
}

.admin-form button,
.admin-btn{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer
}

.primary{
  background:#315d42;
  color:#fff
}

.danger{
  background:#b43b3b;
  color:#fff
}

.muted{
  color:#66736a;
  font-size:13px
}

.status{
  margin-top:12px;
  font-weight:700
}

.login{
  max-width:420px;
  margin:140px auto
}

.login input{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin:10px 0;
  padding:13px;
  border:1px solid #d5ddd6;
  border-radius:8px
}

.login button{
  width:100%
}

.gallery-admin{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.gallery-admin article{
  border:1px solid #e1e7e1;
  border-radius:10px;
  overflow:hidden;
  background:#fff
}

.gallery-admin img{
  width:100%;
  aspect-ratio:1.2;
  object-fit:cover;
  display:block
}

.gallery-admin .meta{
  padding:10px
}

.gallery-admin h3{
  font-size:14px;
  margin:0 0 5px
}

.gallery-admin p{
  font-size:12px;
  margin:0 0 10px;
  color:#68746b
}

.logout{
  background:#fff;
  border:1px solid #ccd5cd
}

.hidden{
  display:none!important
}

@media(max-width:760px){
  .admin-wrap{
    margin-top:84px
  }

  .admin-form{
    grid-template-columns:1fr
  }

  .gallery-admin{
    grid-template-columns:repeat(2,1fr)
  }

  .admin-head{
    align-items:flex-start;
    flex-direction:column
  }
}

@media(max-width:430px){
  .gallery-admin{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="admin-wrap">

  <!-- 로그인 -->
  <section id="loginBox" class="admin-card login">

    <h1>홍능조경 관리자</h1>

    <p class="muted">
      관리자용 사진 관리 페이지입니다.
    </p>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="관리자 비밀번호"
    >

    <button
      id="loginBtn"
      class="admin-btn primary"
      type="button"
    >
      로그인
    </button>

    <div id="loginMsg" class="status"></div>

  </section>


  <!-- 관리자 앱 -->
  <section id="app" class="hidden">

    <!-- 헤더 -->
    <div class="admin-card">

      <div class="admin-head">

        <div>
          <h1>갤러리 사진 관리</h1>

          <p class="muted">
            사진을 업로드하면 GitHub 저장소에 저장되고
            홈페이지 갤러리에 반영됩니다.
          </p>
        </div>

        <button
          id="logoutBtn"
          class="admin-btn logout"
          type="button"
        >
          로그아웃
        </button>

      </div>

    </div>


    <!-- 업로드 -->
    <div class="admin-card">

      <h2>사진 업로드</h2>

      <form id="uploadForm" class="admin-form">

        <label>
          사진

          <input
            id="file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple
            required
          >
        </label>


        <label>
          카테고리

          <select id="category">

            <option value="pine">
              소나무
            </option>

            <option value="planting">
              식재
            </option>

            <option value="care">
              관리
            </option>

            <option value="garden">
              정원·조경
            </option>

          </select>

        </label>


        <label>
          제목

          <input
            id="title"
            type="text"
            maxlength="100"
            placeholder="예: 대형 소나무 식재 현장"
          >
        </label>


        <button
          class="admin-btn primary"
          type="submit"
        >
          업로드
        </button>

      </form>


      <div id="uploadMsg" class="status"></div>

      <p class="muted">
        JPG/PNG/WEBP/GIF, 사진 1장당 8MB 이하를 권장합니다.
      </p>

    </div>


    <!-- 갤러리 -->
    <div class="admin-card">

      <div class="admin-head">

        <h2>등록된 사진</h2>

        <button
          id="refreshBtn"
          class="admin-btn logout"
          type="button"
        >
          새로고침
        </button>

      </div>

      <div
        id="items"
        class="gallery-admin"
      ></div>

    </div>

  </section>

</div>


<script>

const $ = s => document.querySelector(s);

const api = p => `../api/${p}`;


/* =========================================================
   로그인 상태 확인
========================================================= */

async function status(){

  try{

    const r = await fetch(
      api('admin/login'),
      {
        method:'GET',
        credentials:'same-origin',
        cache:'no-store'
      }
    );

    const j = await r.json();

    if(j.ok){

      showApp();

    }

  }catch(e){

    console.error('로그인 상태 확인 실패:',e);

  }

}


/* =========================================================
   관리자 화면 표시
========================================================= */

function showApp(){

  $('#loginBox').classList.add('hidden');

  $('#app').classList.remove('hidden');

  loadItems();

}


/* =========================================================
   로그인
========================================================= */

$('#loginBtn').onclick = async () => {

  const password = $('#password').value;

  if(!password){

    $('#loginMsg').textContent =
      '관리자 비밀번호를 입력하세요.';

    return;

  }

  $('#loginMsg').textContent =
    '로그인 중...';

  try{

    const r = await fetch(
      api('admin/login'),
      {
        method:'POST',

        credentials:'same-origin',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          password
        })
      }
    );

    const j = await r.json();

    if(j.ok){

      $('#password').value = '';

      $('#loginMsg').textContent = '';

      showApp();

    }else{

      $('#loginMsg').textContent =
        j.error || '로그인 실패';

    }

  }catch(e){

    console.error(e);

    $('#loginMsg').textContent =
      '로그인 요청에 실패했습니다.';

  }

};


/* =========================================================
   엔터키 로그인
========================================================= */

$('#password').addEventListener(
  'keydown',
  e => {

    if(e.key === 'Enter'){

      e.preventDefault();

      $('#loginBtn').click();

    }

  }
);


/* =========================================================
   로그아웃
========================================================= */

$('#logoutBtn').onclick = async () => {

  try{

    await fetch(
      api('admin/login'),
      {
        method:'DELETE',
        credentials:'same-origin'
      }
    );

  }catch(e){

    console.error(e);

  }

  location.reload();

};


/* =========================================================
   새로고침
========================================================= */

$('#refreshBtn').onclick = () => {

  loadItems();

};


/* =========================================================
   사진 업로드
========================================================= */

$('#uploadForm').onsubmit = async e => {

  e.preventDefault();


  const files = [...$('#file').files];

  if(!files.length){

    return;

  }


  $('#uploadMsg').textContent =
    '업로드 중...';


  let uploaded = 0;


  for(const f of files){

    /* 파일 크기 */

    if(f.size > 8 * 1024 * 1024){

      $('#uploadMsg').textContent =
        `${f.name}: 8MB를 초과했습니다.`;

      continue;

    }


    /* 파일 → Data URL */

    const dataUrl = await new Promise(
      (res,rej) => {

        const fr = new FileReader();

        fr.onload = () => res(fr.result);

        fr.onerror = rej;

        fr.readAsDataURL(f);

      }
    );


    /* 제목 */

    const title =
      $('#title').value.trim()
      ||
      f.name.replace(/\.[^/.]+$/,'');


    try{

      const r = await fetch(
        api('admin/upload'),
        {
          method:'POST',

          /*
           * 중요:
           * 로그인 시 발급된
           * __Host-hn_admin 쿠키를
           * upload API에도 전달
           */

          credentials:'same-origin',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            fileName:f.name,

            dataUrl,

            title,

            category:$('#category').value

          })

        }
      );


      const j = await r.json();


      if(!j.ok){

        /*
         * 세션 만료
         */

        if(r.status === 401){

          $('#uploadMsg').textContent =
            '로그인 세션이 만료되었습니다. 다시 로그인해주세요.';

          setTimeout(
            () => location.reload(),
            1200
          );

          return;

        }


        $('#uploadMsg').textContent =
          j.error ||
          `${f.name} 업로드 실패`;

        return;

      }


      uploaded++;


      $('#uploadMsg').textContent =
        `${uploaded}/${files.length}장 업로드 중...`;

    }catch(e){

      console.error(e);

      $('#uploadMsg').textContent =
        `${f.name} 업로드 중 오류가 발생했습니다.`;

      return;

    }

  }


  if(uploaded === files.length){

    $('#uploadMsg').textContent =
      `${uploaded}장 업로드 완료`;

    $('#uploadForm').reset();

    loadItems();

  }

};


/* =========================================================
   갤러리 목록
========================================================= */

async function loadItems(){

  $('#items').innerHTML =
    '<p class="muted">불러오는 중...</p>';


  try{

    const r = await fetch(
      api('gallery'),
      {
        method:'GET',
        credentials:'same-origin',
        cache:'no-store'
      }
    );


    const j = await r.json();


    if(!j.ok){

      $('#items').innerHTML =
        '<p>갤러리를 불러오지 못했습니다.</p>';

      return;

    }


    const items = Array.isArray(j.items)
      ? j.items
      : [];


    $('#items').innerHTML =

      items.map(
        x => `

          <article>

            <img
              src="../${x.src}"
              alt="${esc(x.title || '')}"
            >

            <div class="meta">

              <h3>
                ${esc(x.title || '사진')}
              </h3>

              <p>
                ${esc(
                  x.categoryLabel ||
                  x.category ||
                  ''
                )}
                ·
                ${
                  x.managed
                    ? '관리자 업로드'
                    : '기본 이미지'
                }
              </p>

              ${
                x.managed

                ?

                `
                <button
                  class="admin-btn danger"
                  type="button"
                  onclick="removeItem('${escAttr(x.id)}')"
                >
                  삭제
                </button>
                `

                :

                `
                <span class="muted">
                  기본 이미지
                </span>
                `
              }

            </div>

          </article>

        `
      ).join('')

      ||

      '<p>등록된 사진이 없습니다.</p>';

  }catch(e){

    console.error(e);

    $('#items').innerHTML =
      '<p>갤러리를 불러오는 중 오류가 발생했습니다.</p>';

  }

}


/* =========================================================
   사진 삭제
========================================================= */

async function removeItem(id){

  if(!confirm('이 사진을 삭제할까요?')){

    return;

  }


  try{

    const r = await fetch(
      api('admin/delete'),
      {
        method:'POST',

        credentials:'same-origin',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          id
        })
      }
    );


    const j = await r.json();


    if(r.status === 401){

      alert(
        '로그인 세션이 만료되었습니다. 다시 로그인해주세요.'
      );

      location.reload();

      return;

    }


    alert(
      j.ok
        ? '삭제되었습니다.'
        : (j.error || '삭제 실패')
    );


    if(j.ok){

      loadItems();

    }

  }catch(e){

    console.error(e);

    alert(
      '삭제 요청 중 오류가 발생했습니다.'
    );

  }

}


/* =========================================================
   HTML Escape
========================================================= */

function esc(s){

  return String(s).replace(
    /[&<>'"]/g,

    c => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[c])

  );

}


/* =========================================================
   Attribute Escape
========================================================= */

function escAttr(s){

  return String(s).replace(
    /[&<>'"]/g,

    c => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[c])

  );

}


/* =========================================================
   시작
========================================================= */

status();

</script>

</body>
</html>
