<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>홍능조경 관리자</title><link rel="stylesheet" href="../css/style.css"><style>
body{background:#f5f7f4}.admin-wrap{width:min(1100px,calc(100% - 28px));margin:100px auto 60px}.admin-card{background:#fff;border:1px solid #e1e7e1;border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06);margin-bottom:18px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.admin-head h1{margin:0}.admin-form{display:grid;grid-template-columns:1fr 180px 1fr auto;gap:10px;align-items:end}.admin-form label{display:grid;gap:6px;font-size:13px;font-weight:800;color:#31513d}.admin-form input,.admin-form select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5ddd6;border-radius:8px;background:#fff}.admin-form button,.admin-btn{border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#315d42;color:#fff}.danger{background:#b43b3b;color:#fff}.muted{color:#66736a;font-size:13px}.status{margin-top:12px;font-weight:700}.login{max-width:420px;margin:140px auto}.login input{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:13px;border:1px solid #d5ddd6;border-radius:8px}.login button{width:100%}.gallery-admin{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.gallery-admin article{border:1px solid #e1e7e1;border-radius:10px;overflow:hidden;background:#fff}.gallery-admin img{width:100%;aspect-ratio:1.2;object-fit:cover;display:block}.gallery-admin .meta{padding:10px}.gallery-admin h3{font-size:14px;margin:0 0 5px}.gallery-admin p{font-size:12px;margin:0 0 10px;color:#68746b}.logout{background:#fff;border:1px solid #ccd5cd}.hidden{display:none!important}@media(max-width:760px){.admin-wrap{margin-top:84px}.admin-form{grid-template-columns:1fr}.gallery-admin{grid-template-columns:repeat(2,1fr)}.admin-head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.gallery-admin{grid-template-columns:1fr}}
</style></head><body><div class="admin-wrap"><section id="loginBox" class="admin-card login"><h1>홍능조경 관리자</h1><p class="muted">관리자용 사진 관리 페이지입니다.</p><input id="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호"><button id="loginBtn" class="admin-btn primary">로그인</button><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="admin-card"><div class="admin-head"><div><h1>갤러리 사진 관리</h1><p class="muted">사진을 업로드하면 GitHub 저장소에 저장되고 홈페이지 갤러리에 반영됩니다.</p></div><button id="logoutBtn" class="admin-btn logout">로그아웃</button></div></div>
<div class="admin-card"><h2>사진 업로드</h2><form id="uploadForm" class="admin-form"><label>사진<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></label><label>카테고리<select id="category"><option value="pine">소나무</option><option value="planting">식재</option><option value="care">관리</option><option value="garden">정원·조경</option></select></label><label>제목(여러 장이면 파일명이 기본값)<input id="title" type="text" maxlength="100" placeholder="예: 대형 소나무 식재 현장"></label><button class="admin-btn primary" type="submit">업로드</button></form><div id="uploadMsg" class="status"></div><p class="muted">JPG/PNG/WEBP/GIF, 사진 1장당 8MB 이하를 권장합니다.</p></div>
<div class="admin-card"><div class="admin-head"><h2>등록된 사진</h2><button id="refreshBtn" class="admin-btn logout">새로고침</button></div><div id="items" class="gallery-admin"></div></div></section></div><script>
const $=s=>document.querySelector(s); const api=p=>`../api/${p}`;
async function status(){const r=await fetch(api('admin/login'));const j=await r.json();if(j.ok)showApp();}
function showApp(){ $('#loginBox').classList.add('hidden'); $('#app').classList.remove('hidden'); loadItems(); }
$('#loginBtn').onclick=async()=>{const password=$('#password').value; const r=await fetch(api('admin/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const j=await r.json(); if(j.ok)showApp(); else $('#loginMsg').textContent=j.error||'로그인 실패';};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logoutBtn').onclick=async()=>{await fetch(api('admin/login'),{method:'DELETE'});location.reload()};
$('#refreshBtn').onclick=loadItems;
$('#uploadForm').onsubmit=async e=>{e.preventDefault();const files=[...$('#file').files];if(!files.length)return;$('#uploadMsg').textContent='업로드 중...';for(const f of files){if(f.size>8*1024*1024){$('#uploadMsg').textContent=`${f.name}: 8MB를 초과했습니다.`;continue}const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});const title=$('#title').value.trim()||f.name.replace(/\.[^/.]+$/,'');const r=await fetch(api('admin/upload'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileName:f.name,dataUrl,title,category:$('#category').value})});const j=await r.json();if(!j.ok){$('#uploadMsg').textContent=j.error||`${f.name} 업로드 실패`;return}}$('#uploadMsg').textContent=`${files.length}장 업로드 완료`;$('#uploadForm').reset();loadItems()};
async function loadItems(){const r=await fetch(api('gallery'),{cache:'no-store'});const j=await r.json();if(!j.ok){$('#items').innerHTML='<p>갤러리를 불러오지 못했습니다.</p>';return}$('#items').innerHTML=j.items.map(x=>`<article><img src="../${x.src}" alt=""><div class="meta"><h3>${esc(x.title)}</h3><p>${esc(x.categoryLabel||x.category)} · ${x.managed?'관리자 업로드':'기본 이미지'}</p>${x.managed?`<button class="admin-btn danger" onclick="removeItem('${x.id}')">삭제</button>`:'<span class="muted">기본 이미지</span>'}</div></article>`).join('')||'<p>등록된 사진이 없습니다.</p>'}
async function removeItem(id){if(!confirm('이 사진을 삭제할까요?'))return;const r=await fetch(api('admin/delete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const j=await r.json();alert(j.ok?'삭제되었습니다.':(j.error||'삭제 실패'));if(j.ok)loadItems()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
status();
</script></body></html>
