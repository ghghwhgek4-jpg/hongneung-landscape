<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>홍능조경 관리자 · 사진 관리</title>
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<header class="admin-header"><div class="admin-header-inner">
  <a class="brand" href="index.html"><img src="images/logo.png" alt="홍능조경"></a>
  <strong>사진 관리자</strong>
  <a href="gallery.html">홈페이지 보기</a>
</div></header>

<main class="admin-main">
  <section id="loginPanel" class="admin-card">
    <span class="eyebrow dark">ADMIN</span>
    <h1>사진 관리자 로그인</h1>
    <p>관리자 인증 토큰은 Cloudflare 환경변수로 보호합니다.</p>
    <label>관리자 토큰<input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"></label>
    <button class="admin-btn" id="loginBtn">로그인</button>
    <p class="admin-note" id="loginMsg"></p>
  </section>

  <section id="dashboard" class="admin-dashboard" hidden>
    <div class="admin-toolbar">
      <div><span class="eyebrow dark">GALLERY MANAGER</span><h1>사진 관리</h1></div>
      <button class="admin-btn secondary" id="logoutBtn">로그아웃</button>
    </div>

    <div class="admin-card">
      <form id="uploadForm" class="upload-form">
        <div class="dropzone" id="dropzone">
          <input id="files" name="files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          <strong>사진을 선택하세요</strong>
          <span>JPG / PNG / WebP · 여러 장 선택 가능</span>
        </div>
        <div class="form-grid">
          <label>카테고리
            <select id="category" name="category">
              <option value="pine">소나무</option>
              <option value="planting">식재</option>
              <option value="care">관리</option>
              <option value="garden">정원·조경</option>
            </select>
          </label>
          <label>기본 제목
            <input id="title" name="title" placeholder="예: 대형 소나무 식재">
          </label>
          <label class="check"><input id="published" type="checkbox" checked> 홈페이지 공개</label>
        </div>
        <button class="admin-btn" type="submit">사진 업로드</button>
        <p id="uploadMsg" class="admin-note"></p>
      </form>
    </div>

    <div class="admin-card">
      <div class="admin-list-head"><h2>등록된 사진</h2><button class="admin-btn secondary" id="refreshBtn">새로고침</button></div>
      <div id="photoList" class="admin-photo-list"></div>
    </div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const tokenKey='hongneung_admin_token';
let token=sessionStorage.getItem(tokenKey)||'';

function setMessage(id,msg,error=false){const el=$(id);el.textContent=msg;el.classList.toggle('error',error);}
function auth(){return token?{Authorization:'Bearer '+token}:{}} 
function showDashboard(){ $('#loginPanel').hidden=true; $('#dashboard').hidden=false; loadPhotos(); }
async function login(){
  token=$('#token').value.trim();
  if(!token){setMessage('#loginMsg','토큰을 입력하세요.',true);return}
  const r=await fetch('/api/admin/gallery?all=1',{headers:auth()});
  if(!r.ok){token='';setMessage('#loginMsg','인증에 실패했습니다. Cloudflare ADMIN_TOKEN을 확인하세요.',true);return}
  sessionStorage.setItem(tokenKey,token); showDashboard();
}
async function loadPhotos(){
  const r=await fetch('/api/admin/gallery?all=1',{headers:auth()});
  if(r.status===401){sessionStorage.removeItem(tokenKey);token='';$('#dashboard').hidden=true;$('#loginPanel').hidden=false;setMessage('#loginMsg','세션이 만료되었습니다.',true);return}
  const data=await r.json();
  $('#photoList').innerHTML=(data.items||[]).map(x=>`
    <article class="admin-photo">
      <img src="${x.url}" alt="">
      <div class="admin-photo-info">
        <strong>${esc(x.title)}</strong>
        <span>${esc(cat(x.category))} · ${x.published?'공개':'비공개'}</span>
        <div class="admin-photo-actions">
          <button data-action="toggle" data-id="${x.id}">${x.published?'비공개':'공개'}</button>
          <button data-action="delete" data-id="${x.id}" class="danger">삭제</button>
        </div>
      </div>
    </article>`).join('') || '<p class="admin-note">등록된 사진이 없습니다.</p>';
}
function cat(c){return ({pine:'소나무',planting:'식재',care:'관리',garden:'정원·조경'})[c]||c}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#loginBtn').onclick=login;
$('#logoutBtn').onclick=()=>{sessionStorage.removeItem(tokenKey);location.reload()};
$('#refreshBtn').onclick=loadPhotos;
$('#uploadForm').onsubmit=async e=>{
  e.preventDefault();
  const files=[...$('#files').files]; if(!files.length){setMessage('#uploadMsg','사진을 선택하세요.',true);return}
  const fd=new FormData();
  files.forEach(f=>fd.append('files',f));
  fd.append('category',$('#category').value);
  fd.append('title',$('#title').value.trim());
  fd.append('published',$('#published').checked?'1':'0');
  const r=await fetch('/api/admin/upload',{method:'POST',headers:auth(),body:fd});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){setMessage('#uploadMsg',d.error||'업로드에 실패했습니다.',true);return}
  setMessage('#uploadMsg',`${d.count||files.length}개 업로드 완료`);
  e.target.reset(); $('#published').checked=true; loadPhotos();
};
$('#photoList').onclick=async e=>{
  const b=e.target.closest('button[data-action]'); if(!b)return;
  const id=b.dataset.id, action=b.dataset.action;
  if(action==='delete' && !confirm('이 사진을 삭제할까요?')) return;
  const url=action==='delete'?'/api/admin/gallery/'+id:'/api/admin/gallery/'+id+'/toggle';
  const r=await fetch(url,{method:action==='delete'?'DELETE':'POST',headers:auth()});
  if(!r.ok){alert('처리에 실패했습니다.');return} loadPhotos();
};
if(token){$('#token').value=token;showDashboard()}
</script>
</body></html>
